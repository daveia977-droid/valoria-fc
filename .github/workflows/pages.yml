name: Publier VALORIA FC sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Public repositories use free standard runners. Never start a potentially
    # billable private-repository build before the owner's plan is verified.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Préparer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Installer Chromium pour les tests
        run: npx playwright install --with-deps chromium
      - name: Compiler pour /valoria-fc/
        run: npm run build -- --base=/valoria-fc/
      - name: Exécuter les tests existants
        run: npm test
      - name: Vérifier la version compilée sous /valoria-fc/
        run: npm run test:pages
      - name: Préparer uniquement dist pour Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lire la configuration GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        # Activation, if needed: repository Settings > Pages > GitHub Actions.
        # Enabling Pages here would require an additional administrator token.
      - name: Publier l’artefact compilé
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
